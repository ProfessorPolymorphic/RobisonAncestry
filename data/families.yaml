# Families — a union of (usually) two partners and the children of that union.
#
#   id          stable slug
#   partners    list of person ids (1 or 2). Order doesn't matter.
#   events      marriage / divorce etc., same shape as person events (several allowed)
#   children    list of {person, confidence, basis, sources}, in birth order.
#               confidence of the parent→child link:
#                 documented  a record states the relationship (birth reg., obituary, etc.)
#                 inferred    chain of reasoning from records (census adjacency, naming)
#                 stated      asserted by a compiled source (the typed chart) — not yet checked  [default]
#                 unverified  placement is a guess; needs confirmation
#   sources     sources for the union itself (if different from the marriage event)
#   notes

