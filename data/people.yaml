# People — one entry per person. See README.md for the full schema.
#
#   id        stable slug (opaque — never "fix" it when a date changes; other files reference it)
#   names     list; FIRST entry is the preferred name. kind: variant (same name, other spelling/
#             indexing) | conflict (a source asserts a genuinely different name) | nickname
#   sex       M | F | (omit if unknown)
#   living    true/false. If omitted: treated as living when there is no death event and the
#             person was born within the last 100 years.
#   events    list of {type, date, place, sources, note, preferred}. Several events of the same
#             type are allowed — that is how conflicting claims are kept. The first one (or the one
#             marked preferred: true) is what charts show; `tree.py conflicts` lists the rest.
#             date grammar: 1869 | 1869-03 | 1869-03-19 | abt 1802 | bef 1851 | aft 1871 | bet 1802 and 1804
#   notes     free text (markdown)
#   todo      list of open questions for this person

# ─────────────────────────────────────────────────────────────────────────────
# Generation 0 — the immigrant (typed chart only)
# ─────────────────────────────────────────────────────────────────────────────

- id: hugh-robison-1766
  names:
    - {given: Hugh, surname: Robison, sources: [typed-chart]}
  sex: M
  events:
    - {type: birth, date: 1762-11, place: county-tyrone, sources: [robison-headstones, bert-chart-appx-a],
       note: "Headstone: 'BORN NOV. 1762'. Paul Robison adds the family still had distant cousins in Londonderry."}
    - {type: birth, date: 1766, place: county-tyrone, sources: [typed-chart, pioneer-life-1904],
       note: "The retyped chart and the 1904 history give 1766 — contradicted by the headstone."}
    - {type: immigration, date: abt 1792, place: new-brunswick, sources: [pioneer-life-1904, journey-so-far-2006, typed-chart],
       note: "To New Brunswick with Rebeca and infant son Hugh. Chart header says only 'arriving Canada about 1792'."}
    - {type: residence, date: abt 1806, place: hillier, sources: [pioneer-life-1904, journey-so-far-2006],
       note: "After ~14 years in New Brunswick, to Hillier Township c.1806–07; bought ~200 acres at Stinson's Block, later 'Robison's Point'. Presbyterian."}
    - {type: death, date: 1844-06-18, place: hillier, sources: [robison-headstones, bert-chart-appx-a],
       note: "Headstone: died 18 June 1844 (aged 81)."}
    - {type: death, date: 1842, sources: [typed-chart], note: "Retyped chart; contradicted by the headstone."}
    - {type: burial, place: locie-cemetery, sources: [robison-headstones, pioneer-life-1904],
       note: "Buried on the old family property, now Locie Cemetery."}
  notes: >
    Known from the typed chart and the 1904 county history "Pioneer Life on the Bay of Quinte"
    (the chart may derive from it). The 2026 report searched three censuses, sixty years of Ontario
    death registrations and four spellings for a Robison born before 1793 in the Bay of Quinte area
    and found nothing — consistent with a man who died in 1842, before the first nominal census
    (1851). A Tyrone (Irish, Presbyterian) origin suggests Ulster-Scots background but does not by
    itself support the Clan Gunn (Caithness) tradition — see README "Open questions". On that
    tradition: Robison and Robson are on the sept list recognized by the Chief and Clan Council
    (sources cgsna, clan-gunn), the Rob- septs tracing to Robert, son of George Gunn the Crowner of
    Caithness, whose line held Braemore (source clanscape-gunn). Paul Robison's 1994 arms carry
    Gunn elements and the Gunn motto. Sept affiliation is by surname, not proved descent.
  todo:
    - Upper Canada Land Petitions (LAC RG 1 L3, "R" bundles) — would confirm origin and the Stinson's Block purchase.
    - Hillier cemetery / family-plot transcriptions for a stone d. 1842.
    - County Tyrone church, land or estate records for Hugh Robison and the Dougalls.

