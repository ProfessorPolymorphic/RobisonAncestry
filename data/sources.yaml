- id: cgsna
  title: Clan Gunn Society of North America — official sept list
  type: website
  tier: compiled
  url: https://cgsna.org/septs/
  note: >
    501(c)(3) society working with the Scottish Clan Gunn Society. The Chief and Council recognize
    29 sept names including ROBISON and ROBSON (Robinson and Robeson appear among the extended
    derivative spellings). The septs page states these names "are nearly all derived from the sons
    or descendants of 'the Crowner' — James, John (or Ian), Henry, Robert, William and George";
    the Rob- names trace to Robert. Sept membership is an affiliation of surname, not proof of
    descent — see section 05 of the 2026 report. Requested for linking by Colby, Aug 2026.

- id: clanscape-gunn
  title: '"History of Clan Gunn" — Clanscape (clanscape.scot), by Aly Wight'
  type: website
  tier: compiled
  url: https://clanscape.scot/blogs/clans/history-of-clan-gunn
  note: >
    Narrative clan history: Norse origin (Gunni, late 12th c., via Ragnhild, heiress of estates of
    her brother Harald, Jarl of Orkney; claimed descent from Olaf the Black); George Gunn the
    Crowner of Caithness, "Am Braisdeach Mor", ruling from Gunn's Castle at Clyth; the St Tayre
    chapel massacre by the Keiths (this account dates it c.1478; others c.1464) — the Crowner and
    seven men killed after the Keiths came two to a horse; son ROBERT founded the ROBSON GUNNS of
    BRAEMORE, whose descendant Sir William Gunn became an imperial general by 1649; motto "Aut pax
    aut bellum"; plant badge juniper; first recognized chief in 200+ years, Iain Alexander Gunn of
    Banniskirk, 2015. Requested for linking by Colby, Aug 2026.

