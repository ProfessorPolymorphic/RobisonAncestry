- id: lewis-line-report-2026
  title: "The Lewis Line of Eastport — deep-research report, Aug 2026"
  type: compiled-report
  tier: compiled
  date: 2026-08-23
  files:
    - "The Lewis Line of Eastport.md"
  note: >
    Synthesis of an 18-agent research run (census images 1910-1950, Official Registers
    1907-1921, Bonners Ferry Herald via Chronicling America, Idaho death index, BC vital
    registrations, Meriwether Lewis scholarship; every key claim adversarially re-verified
    against the cited images). Documents the family-memory correction (wife Daisy vs
    daughter Eva), Daisy's probable Macdonald maiden identity, Spencer's three marriages,
    and the verdict on the Meriwether Lewis lore: impossible as stated (the explorer and
    his only full brother died childless; his sister's children were Andersons), unsupported
    in any looser form.

