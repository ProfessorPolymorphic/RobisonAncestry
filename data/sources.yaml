# Sources — every fact in people.yaml / families.yaml cites one or more of these ids.
#
# Fields:
#   id          stable slug, referenced from events/names/links
#   title       what the source is
#   type        family-chart | compiled-report | vital-index | census | cemetery |
#               newspaper | archive | register | website | book | border-record
#   tier        primary (original record) | derivative (index/transcription of a record)
#               | compiled (someone's write-up: family chart, report, website)
#   date        when the source was created (date grammar: see README)
#   files       scans/files in this folder that are this source (add as paper is digitized)
#   url, repository, citation, note   as needed

- id: typed-chart
  title: '"The Robison Family" — typed descendant chart'
  type: family-chart
  tier: compiled
  date: abt 1988
  author: Unknown family member (compiled from family knowledge)
  files:
    - "family tree 001.jpg"
  note: >
    Typewritten single-page chart, nine generations from Hugh Robison (b.1766) down to
    children born 1982–1986. Header reads "ARRIVING CANADA ABOUT 1792 FROM COUNTY OF TYRONE
    IRELAND". Dating: latest birth shown is Mar 1986 and Bill Robison's sons (b. c.1970/72)
    are not shown, so it was probably compiled late 1980s from a branch in Bert's family.
    Gives exact day-month-year dates that no other source in this dataset has. Children are
    given by first name only; surnames are assumed from the father. Spelling "Samual" is the chart's.

- id: robison-line-report
  title: "The Robison Line — Seven generations, 1802 to the present"
  type: compiled-report
  tier: compiled
  date: 2026-08
  author: Compiled for Barrie Robison
  files:
    - "The-Robison-Line_1.docx"
    - "tree-crop.png"
  note: >
    Research report built from online indexes (census, vital statistics, cemetery and
    newspaper transcriptions). Does NOT know about Hugh Robison or the Tyrone origin; lists
    Samuel's father as "Open". Every census / vital-index fact in this dataset that cites
    census-* or *-vitals ids was taken from this report's citations and has not yet been
    re-checked against the original index entries.

