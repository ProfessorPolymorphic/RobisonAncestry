- id: census-1910-us-eastport
  title: 1910 US Census — Spencer Lewis household, Eastport (Bonner County), Idaho
  type: census
  tier: primary
  date: 1910-05-07
  url: https://archive.org/details/13thcensus1910po223unit
  note: >
    ED 77, sheet 12A, lines 4-7 (NARA T624 roll 223, leaf 121; page image read via IIIF).
    Lewis, Spencer, head, 34, second marriage (M2) of 1 8/12 years, b. Michigan, parents'
    birthplaces "Don't Know", Custom Inspector, U.S.; wife Daisy J., 25, first marriage,
    1 child/1 living, b. Canada (French), immigrated 1908; daughter Eva R., 5, b. Idaho,
    MOTHER b. NEW YORK (i.e. from an earlier marriage); daughter Jean L., 1, b. Idaho,
    mother b. Canada. Anchored to Eastport by Immigration Service neighbours (Voligny,
    Akiyama) who appear at "Eastport Idaho" in the 1911 Official Register.

- id: census-1920-us-eastport
  title: 1920 US Census — Spencer A. Lewis household, Eastport Precinct, Boundary County, Idaho
  type: census
  tier: primary
  date: 1920-01
  url: https://archive.org/details/14thcensusofpopu289unit
  note: >
