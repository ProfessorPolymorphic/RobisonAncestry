- id: pioneer-life-1904
  title: "Pioneer Life on the Bay of Quinte (Toronto, 1904)"
  type: book
  tier: compiled
  date: 1904
  url: https://archive.org/stream/pioneerlifeonbay00torouoft/pioneerlifeonbay00torouoft_djvu.txt
  note: >
    County history with family sketches. Hugh Robison b. 1766 County Tyrone; m. Rebecca Dougall,
    dau. of Dr. William Dougall; to New Brunswick c.1792 with infant son Hugh; to Hillier Township,
    Prince Edward County c.1806–07; 200 acres at Stinson's Block ("Robison's Point"); Presbyterian;
    d. aged 76, buried on the family property. Samuel m. Jane Arthur; William A. m. Mary E.
    "Berringer", settled Consecon; their son Herbert a lawyer in Carman, Manitoba. Published a
    century after the events — strong inherited family history, not original record. The typed
    chart's header matches this book closely and may derive from it.

- id: mhs-robison-he
  title: "Manitoba Historical Society, Memorable Manitobans: Herbert Edward Robison"
  type: website
  tier: compiled
  url: https://www.mhs.mb.ca/docs/people/robison_he.shtml
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5353.HEIC"
  note: >
    Cites birth registrations, newspapers, burial transcriptions. Born Consecon 19 Mar 1869, son of
    William A. Robison and Mary E. Barringer; teacher, then lawyer; to Carman 1899; mayor of Carman
    1911–1913; King's Counsel 1914; m. Anna Falconer 11 Jul 1900; five children; d. Carman 18 Jul 1933.

- id: obit-bert-2013
  title: "The Golden Star — obituary of Herbert \"Bert\" Robison"
  type: newspaper
