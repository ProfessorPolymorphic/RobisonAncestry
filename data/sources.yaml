- id: bfh-eva-wedding-1922
  title: Bonners Ferry Herald, 22 & 29 Jun 1922 — bridal shower and wedding of Miss Eva Lewis
  type: newspaper
  tier: primary
  date: 1922-06-29
  url: https://chroniclingamerica.loc.gov/lccn/sn86091084/1922-06-29/ed-1/seq-1/
  note: >
    "Miss Eva Lewis ... the daughter of U.S. Custom Inspector Spencer Lewis" was given a
    bridal shower by the ladies of Eastport (sister "Miss Jean Lewis" among the guests) and
    married Francis Fowler of Calgary at her Eastport home on Monday 26 Jun 1922. Proves Eva
    was Spencer's DAUGHTER, not his wife — the key correction to the 1911 photo caption's
    remembered roles.

- id: bfh-spence-visits-1912
  title: Bonners Ferry Herald, 2 Aug & 13 Sep 1912 — Mrs. Spence of Cranbrook, sister of Mrs. Spencer Lewis
  type: newspaper
  tier: primary
  date: 1912-09-13
  url: https://chroniclingamerica.loc.gov/lccn/sn86091084/1912-09-13/ed-1/seq-5/
  note: >
    Eastport columns, twice: "Mr. and Mrs. J. W. Spence of Cranbrook, B.C. spent Sunday and
    Monday at the home of Mrs. Spence's sister, Mrs. Spencer Lewis." The only adult Spence
    of Cranbrook in the period is J. H. Spence (Wrigley's 1918 BC Directory) — see
    bc-marriage-1908-spence for the identification of Mrs. Spence, and hence the hypothesis
    for Daisy's maiden family.

- id: bc-marriage-1908-spence
  title: BC marriage registration 1908-09-162863 — John Henry Spence & Annie Patrick Macdonald, Cranbrook
  type: register
  tier: primary
  date: 1908-04-28
  url: https://search-collections.royalbcmuseum.bc.ca/genealogy-images/004401580/004401580_00441.jpg
  note: >
    Original registration image read: John Henry Spence, 35, engineer, of Cranbrook, b.
    Waterdown, Ont. (parents Wm Spence & Rachel S. Clarke) m. ANNIE PATRICK MACDONALD, 29,
    spinster, of Cranbrook, born DALKEITH, SCOTLAND, parents WM MACDONALD and ALEXANDERINA
    PATRICK; witness Mary Macdonald; Presbyterian. If the Herald's "sister" is literal,
    Daisy Lewis was née MACDONALD, daughter of William MacDonald and Alexanderina Patrick —
    a hypothesis, not proof, until Daisy's own death certificate (#026548) or 1908 marriage
    record is obtained.

