- id: official-registers-1907-21
  title: Official Register of the United States, 1907–1921 editions — Spencer Lewis, Customs Service, Eastport
  type: register
  tier: primary
  url: https://archive.org/details/officialregister11unit
  note: >
    Seven biennial editions (1907, 1909, 1911, 1913, 1915, 1917, 1921; full OCR read on
    archive.org) list Spencer Lewis, Treasury Dept, Customs Service — Inspector at Eastport,
    Idaho by 1 Jul 1907 ($3.50/day), Mounted Inspector 1909-1913, Inspector 1915-1921
    ($4/day by 1921). EVERY edition gives state of birth MICHIGAN; "whence appointed" At
    Large-Idaho, later Kootenai County, Idaho. No entry in the 1905 register, so the 1907
    Eastport post was his first federal appointment. Independent federal corroboration of
    the retirement clipping's "came west out of Michigan".

- id: bfh-daisy-obit-1919
  title: Bonners Ferry Herald, 29 Jul 1919 — obituary of Mrs. Daisy Lewis of Eastport
  type: newspaper
  tier: primary
  date: 1919-07-29
  url: https://chroniclingamerica.loc.gov/lccn/sn86091084/
  note: >
    Daisy Lewis, wife of Spencer Lewis, died at her Eastport home Friday 25 Jul 1919; born
    7 Sep 1885 at Toronto, Canada; at Eastport "some ten years"; married there to Mr. Lewis
    by Rev. Henderson; survived by husband and three children. Matches the Idaho death index:
