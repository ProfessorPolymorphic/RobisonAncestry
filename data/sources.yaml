- id: spencer-lewis-clipping
  title: Newspaper clipping — Spencer Lewis retires after 36 years as U.S. Customs officer at Eastport
  type: newspaper
  tier: primary
  date: abt 1943
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5291.HEIC"
  note: >
    "RETIRES WITH 36 YEARS AS U.S. OFFICER — Spencer Lewis, U.S. Customs Official At Eastport,
    Takes Well-Earned Vacation — ARRIVED HERE 1907." Came west out of Michigan January 1907;
    36 years as customs patrolman/officer at Eastport, Idaho. Undated clipping, c.1943. This is
    the same Eastport crossing where Herbert Barringer Robison's US border-crossing record was made.

