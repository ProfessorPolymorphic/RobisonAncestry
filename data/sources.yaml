    (birth certificate, announcement) when one is available.

# ---- added 2026-08-23 from Colby's photographs (scans/PicturesfromColbyAug23_2026) ----

- id: journey-so-far-2006
  title: '"A Journey So Far" — family history by Paul A. Robison'
  type: book
  tier: compiled
  date: 2006
  author: Paul Athol Robison (b. 1935), son of Ivan Campbell Robison
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5293.HEIC"
  note: >
    Bound family history, Fall 2006, inscribed "Cousin Bert Robison from his cousin Paul Robison".
    Covers the Robison paternal line (with headstone transcriptions and the family bible, which
    spells "Rebeca" and "Samuel"), the St. Louis / Gadiou-Saint-Louis maternal line back to Pierre
    Gadois (Montreal, 1636), the Stutt (Palatine German -> Irish) line, the Falconer/Campbell
    origin of Annie, a family medical history (Appx Q), and Paul's 1994 grant of arms (Appx P).
    States the typed descendant chart was created by cousin Herbert (Bert) Robison. Reports that a
    professional genealogist DISPROVED the family's United Empire Loyalist claims (Weeks/Dougal) in
    2004. Photographed Aug 2026; pages at IMG_5293-5329.

- id: bert-chart-appx-a
  title: Typed descendant chart, Appendix A version (with month/day dates)
  type: family-chart
  tier: compiled
  author: Herbert Spencer "Bert" Robison, per "A Journey So Far"
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5290.HEIC"
  note: >
    The copy of the typed chart bound into "A Journey So Far" as Appendix A, annotated by Paul
    ("my father" at Ivan). Carries fuller dates than the copy scanned as "family tree 001.jpg" and
    agrees with the headstones where they overlap (Hugh Nov 1762 - 18 Jun 1844; Rebecca Oct 1767 -
    31 Aug 1850; Samuel Sept 1804 - Aug 1876; Jane Arthur Jan 1814 - Mar 1872; Annie b. 30 Dec 1880).
    The other copy's 1766/1842/1766/1852 dates appear to be retyping errors.

- id: robison-headstones
  title: Headstone transcriptions — Locie Cemetery (Hillier) and Carman, Manitoba
  type: cemetery
  tier: derivative
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5306.HEIC"
  note: >
    Appendix D of "A Journey So Far". Locie Cemetery, Stinson's Block, Hillier Township, lot 10/11,
    south shore of Wellers Bay: Hugh Robison (Nov 1762 - 18 Jun 1844) & Rebecca Dougall (Oct 1767 -
    31 Aug 1850); Samual J. Robison (Sept 1804 - 24 Aug 1876) & Jane Arthur (Jan 1814 - 28 Mar 1872).
    Carman, Manitoba: William A. Robison (7 Nov 1839 - 13 Nov 1916) & Mary E. Barringer (11 Mar 1844 -
    25 Aug 1923); Herbert E. Robison (19 Mar 1868 - 18 Jul 1933) & Anna Falconer (30 Dec 1880 - 5 Jul 1933).

- id: weeks-barringer-record
  title: Typed family record — Weeks, Winne and Barringer families
  type: family-chart
  tier: compiled
  files:
    - "scans/PicturesfromColbyAug23_2026/IMG_5305.HEIC"
  note: >
    Appendix C of "A Journey So Far". Samual Weeks (b. 14 Dec 1792, d. 1870, buried Stinson's Block
    cemetery near Weller's Bay) m. Katherine Winne / Catherin Wynn (b. 19 Jul 1794, immigrated from
    England, d. 1870 aged 75). Daughter Nancy Maria Weeks (b. 3 Nov 1819, d. 1 Dec 1853, buried in
    the family plot) m. Walter Levi Barringer, M.D., who drowned at Hastings, Ont. on 24 Jan 1878.
    Their children: Samual, Wesley, Angeline and Mary. Mary Elizabeth Barringer (11 Mar 1844 -
    25 Aug 1923, buried Carman) m. William A. Robison (d. Nov 1916, buried Carman).

